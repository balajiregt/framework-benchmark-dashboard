<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">How the benchmark framework works</title><desc id="desc">Three lanes compare mockserver runtime, agent test generation and JEV review quality. Private evidence becomes validated public aggregates in GitHub result branches, which refresh the deployed dashboard.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#70876e" /></marker></defs>
<rect width="1200" height="700" fill="white" />
<rect x="24" y="24" width="330" height="450" rx="12" fill="#fbfcf8" stroke="#dae1d3" stroke-width="1.5" /><rect x="374" y="24" width="452" height="450" rx="12" fill="#fbfcf8" stroke="#dae1d3" stroke-width="1.5" /><rect x="846" y="24" width="330" height="450" rx="12" fill="#fbfcf8" stroke="#dae1d3" stroke-width="1.5" />
<text x="44" y="55" font-family="Arial, sans-serif" fill="#62735b" font-size="13">01 / RUNTIME COMPARISON</text><text x="44" y="86" font-family="Arial, sans-serif" fill="#203e31" font-size="18" font-weight="bold">Role-Aware Mockserver</text>
<rect x="44" y="113" width="290" height="66" rx="7" fill="#f4f7ef" stroke="#c4d2bb" stroke-width="1.5" /><text x="62" y="140" font-family="Arial, sans-serif" fill="#203e31" font-size="15">Same role journeys and app</text><text x="62" y="161" font-family="Arial, sans-serif" fill="#62735b" font-size="13">Admin · viewer · VIP · failures</text><path d="M189 179V204" fill="none" stroke="#70876e" stroke-width="2" marker-end="url(#arrow)" />
<rect x="44" y="209" width="290" height="67" rx="7" fill="#f4f7ef" stroke="#c4d2bb" stroke-width="1.5" /><text x="62" y="236" font-family="Arial, sans-serif" fill="#203e31" font-size="15">Legacy interception</text><text x="62" y="258" font-family="Arial, sans-serif" fill="#203e31" font-size="15">vs role-aware mockserver</text><path d="M189 276V302" fill="none" stroke="#70876e" stroke-width="2" marker-end="url(#arrow)" />
<rect x="44" y="307" width="290" height="78" rx="7" fill="#f4f7ef" stroke="#c4d2bb" stroke-width="1.5" /><text x="62" y="334" font-family="Arial, sans-serif" fill="#203e31" font-size="15">Role checks + runtime</text><text x="62" y="356" font-family="Arial, sans-serif" fill="#62735b" font-size="13">Setup / journey timing, repetitions</text><text x="62" y="376" font-family="Arial, sans-serif" fill="#62735b" font-size="13">Human setup effort: unmeasured</text><text x="44" y="441" font-family="Arial, sans-serif" fill="#62735b" font-size="13">Does the test environment behave reliably?</text>
<text x="394" y="55" font-family="Arial, sans-serif" fill="#62735b" font-size="13">02 / CONTROLLED MODEL TRIALS</text><text x="394" y="86" font-family="Arial, sans-serif" fill="#203e31" font-size="18" font-weight="bold">API + Playwright / cloud &amp; local</text>
<rect x="394" y="113" width="412" height="50" rx="7" fill="#f4f7ef" stroke="#c4d2bb" stroke-width="1.5" /><text x="412" y="144" font-family="Arial, sans-serif" fill="#203e31" font-size="15">Freeze task, app, model settings and budget</text>
<path d="M600 163V180H494V200M600 180H706V200" fill="none" stroke="#70876e" stroke-width="2" marker-end="url(#arrow)" />
<rect x="394" y="205" width="196" height="65" rx="7" fill="#f4f7ef" stroke="#c4d2bb" stroke-width="1.5" /><text x="412" y="231" font-family="Arial, sans-serif" fill="#203e31" font-size="15">Baseline</text><text x="412" y="253" font-family="Arial, sans-serif" fill="#62735b" font-size="13">App source + plain runner</text>
<rect x="610" y="205" width="196" height="65" rx="7" fill="#e4eddb" stroke="#8fa783" /><text x="628" y="231" font-family="Arial, sans-serif" fill="#203e31" font-size="15">Framework</text><text x="628" y="253" font-family="Arial, sans-serif" fill="#62735b" font-size="13">Add helpers + conventions</text>
<path d="M494 270V285H600V300M706 270V285H600" fill="none" stroke="#70876e" stroke-width="2" marker-end="url(#arrow)" />
<rect x="394" y="305" width="412" height="76" rx="7" fill="#f4f7ef" stroke="#c4d2bb" stroke-width="1.5" /><text x="412" y="330" font-family="Arial, sans-serif" fill="#203e31" font-size="15">3 fresh responses per arm → unchanged tests</text><text x="412" y="352" font-family="Arial, sans-serif" fill="#62735b" font-size="13">Healthy app + independently injected faults</text><text x="412" y="372" font-family="Arial, sans-serif" fill="#62735b" font-size="13">Completion · quality checks · wall time · tokens</text>
<text x="394" y="416" font-family="Arial, sans-serif" fill="#62735b" font-size="13">API-equivalent cost ≠ actual billed spend</text><text x="394" y="441" font-family="Arial, sans-serif" fill="#62735b" font-size="13">Human corrections need a separate timed review</text>
<text x="866" y="55" font-family="Arial, sans-serif" fill="#62735b" font-size="13">03 / LABELLED REVIEW EVALUATION</text><text x="866" y="86" font-family="Arial, sans-serif" fill="#203e31" font-size="18" font-weight="bold">JEV Review</text>
<rect x="866" y="113" width="290" height="66" rx="7" fill="#f4f7ef" stroke="#c4d2bb" stroke-width="1.5" /><text x="884" y="140" font-family="Arial, sans-serif" fill="#203e31" font-size="15">Authored synthetic CRM cases</text><text x="884" y="161" font-family="Arial, sans-serif" fill="#62735b" font-size="13">Independent expected issue labels</text><path d="M1011 179V204" fill="none" stroke="#70876e" stroke-width="2" marker-end="url(#arrow)" />
<rect x="866" y="209" width="290" height="67" rx="7" fill="#f4f7ef" stroke="#c4d2bb" stroke-width="1.5" /><text x="884" y="236" font-family="Arial, sans-serif" fill="#203e31" font-size="15">Review output vs gold labels</text><text x="884" y="258" font-family="Arial, sans-serif" fill="#62735b" font-size="13">Only score actual model responses</text><path d="M1011 276V302" fill="none" stroke="#70876e" stroke-width="2" marker-end="url(#arrow)" />
<rect x="866" y="307" width="290" height="78" rx="7" fill="#f4f7ef" stroke="#c4d2bb" stroke-width="1.5" /><text x="884" y="334" font-family="Arial, sans-serif" fill="#203e31" font-size="15">Precision / recall</text><text x="884" y="356" font-family="Arial, sans-serif" fill="#62735b" font-size="13">Missed issues / false alarms</text><text x="884" y="376" font-family="Arial, sans-serif" fill="#62735b" font-size="13">Provider failure ≠ model accuracy</text><text x="866" y="441" font-family="Arial, sans-serif" fill="#62735b" font-size="13">Can a review distinguish good from bad?</text>
<path d="M189 474V497H600V517M1011 474V497H600M600 474V517" fill="none" stroke="#70876e" stroke-width="2" marker-end="url(#arrow)" />
<rect x="260" y="522" width="680" height="55" rx="8" fill="#e8efdf" stroke="#91a782" /><text x="283" y="546" font-family="Arial, sans-serif" fill="#203e31" font-size="15">Private raw evidence → hashes + denominator checks → public schema</text><text x="283" y="566" font-family="Arial, sans-serif" fill="#62735b" font-size="13">No prompts, generated code, credentials, traces or review notes in the public feed</text>
<path d="M600 577V598" fill="none" stroke="#70876e" stroke-width="2" marker-end="url(#arrow)" />
<rect x="160" y="604" width="880" height="62" rx="8" fill="#275f45" /><text x="190" y="631" font-family="Arial, sans-serif" fill="white" font-size="18">Repository result branches → automatic feed refresh → deployed dashboard</text><text x="190" y="653" font-family="Arial, sans-serif" fill="#d9e7d2" font-size="14">Minute refresh while visible · failed feeds retain labelled prior evidence · no result redeploy required</text>
</svg>
