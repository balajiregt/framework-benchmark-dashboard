<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" role="img" aria-labelledby="title desc"><title id="title">Four benchmark tracks, one evidence pipeline</title><desc id="desc">Runtime, one-response generation, context-assisted workflows and labelled review evaluations produce private evidence. Validated public summaries are published to repository feeds and refreshed by the dashboard.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#70876e"/></marker></defs><rect width="1280" height="800" fill="white"/><rect x="20" y="20" width="295" height="475" rx="9" fill="#fbfcf8" stroke="#c4d2bb"/><text x="36" y="50" font-family="Arial,sans-serif" font-size="13" fill="#62735b" font-weight="normal">01 / ENVIRONMENT</text><text x="36" y="82" font-family="Arial,sans-serif" font-size="19" fill="#203e31" font-weight="bold">Role-Aware Mockserver</text><rect x="33" y="110" width="269" height="85" rx="9" fill="#f4f7ef" stroke="#c4d2bb"/><text x="44" y="142" font-family="Arial,sans-serif" font-size="14" fill="#203e31" font-weight="normal">Same app and role journeys</text><text x="44" y="166" font-family="Arial,sans-serif" font-size="14" fill="#203e31" font-weight="normal">Deterministic test conditions</text><path d="M167 195V219" fill="none" stroke="#70876e" stroke-width="2" marker-end="url(#arrow)"/><rect x="33" y="222" width="269" height="85" rx="9" fill="#f4f7ef" stroke="#c4d2bb"/><text x="44" y="254" font-family="Arial,sans-serif" font-size="14" fill="#203e31" font-weight="normal">Legacy interception vs</text><text x="44" y="278" font-family="Arial,sans-serif" font-size="14" fill="#203e31" font-weight="normal">role-aware mockserver</text><path d="M167 307V331" fill="none" stroke="#70876e" stroke-width="2" marker-end="url(#arrow)"/><rect x="33" y="334" width="269" height="85" rx="9" fill="#f4f7ef" stroke="#c4d2bb"/><text x="44" y="366" font-family="Arial,sans-serif" font-size="14" fill="#203e31" font-weight="normal">Role checks + setup time</text><text x="44" y="390" font-family="Arial,sans-serif" font-size="14" fill="#203e31" font-weight="normal">Journey time + repeatability</text><text x="36" y="468" font-family="Arial,sans-serif" font-size="13" fill="#62735b" font-weight="normal">Runtime evidence</text><path d="M167 495V531" fill="none" stroke="#70876e" stroke-width="2" marker-end="url(#arrow)"/><rect x="335" y="20" width="295" height="475" rx="9" fill="#fbfcf8" stroke="#c4d2bb"/><text x="351" y="50" font-family="Arial,sans-serif" font-size="13" fill="#62735b" font-weight="normal">02 / GENERATION</text><text x="351" y="82" font-family="Arial,sans-serif" font-size="19" fill="#203e31" font-weight="bold">API + Playwright</text><rect x="348" y="110" width="269" height="85" rx="9" fill="#f4f7ef" stroke="#c4d2bb"/><text x="359" y="142" font-family="Arial,sans-serif" font-size="14" fill="#203e31" font-weight="normal">One model response</text><text x="359" y="166" font-family="Arial,sans-serif" font-size="14" fill="#203e31" font-weight="normal">Three repeats per condition</text><path d="M482 195V219" fill="none" stroke="#70876e" stroke-width="2" marker-end="url(#arrow)"/><rect x="348" y="222" width="269" height="85" rx="9" fill="#f4f7ef" stroke="#c4d2bb"/><text x="359" y="254" font-family="Arial,sans-serif" font-size="14" fill="#203e31" font-weight="normal">Source-only prompt vs</text><text x="359" y="278" font-family="Arial,sans-serif" font-size="14" fill="#203e31" font-weight="normal">prompt with framework helpers</text><path d="M482 307V331" fill="none" stroke="#70876e" stroke-width="2" marker-end="url(#arrow)"/><rect x="348" y="334" width="269" height="85" rx="9" fill="#f4f7ef" stroke="#c4d2bb"/><text x="359" y="366" font-family="Arial,sans-serif" font-size="14" fill="#203e31" font-weight="normal">Healthy app + response faults</text><text x="359" y="390" font-family="Arial,sans-serif" font-size="14" fill="#203e31" font-weight="normal">Completion, tokens and time</text><text x="351" y="468" font-family="Arial,sans-serif" font-size="13" fill="#62735b" font-weight="normal">Earlier generation pilot</text><path d="M482 495V531" fill="none" stroke="#70876e" stroke-width="2" marker-end="url(#arrow)"/><rect x="650" y="20" width="295" height="475" rx="9" fill="#fbfcf8" stroke="#c4d2bb"/><text x="666" y="50" font-family="Arial,sans-serif" font-size="13" fill="#62735b" font-weight="normal">03 / QA WORKFLOW</text><text x="666" y="82" font-family="Arial,sans-serif" font-size="19" fill="#203e31" font-weight="bold">Context-assisted QA</text><rect x="663" y="110" width="269" height="85" rx="9" fill="#f4f7ef" stroke="#c4d2bb"/><text x="674" y="142" font-family="Arial,sans-serif" font-size="14" fill="#203e31" font-weight="normal">Same source, tests and helpers</text><text x="674" y="166" font-family="Arial,sans-serif" font-size="12" fill="#203e31" font-weight="normal">Local API pilot: create / update / validate</text><path d="M797 195V219" fill="none" stroke="#70876e" stroke-width="2" marker-end="url(#arrow)"/><rect x="663" y="222" width="269" height="85" rx="9" fill="#f4f7ef" stroke="#c4d2bb"/><text x="674" y="254" font-family="Arial,sans-serif" font-size="14" fill="#203e31" font-weight="normal">Ordinary discovery vs</text><text x="674" y="278" font-family="Arial,sans-serif" font-size="14" fill="#203e31" font-weight="normal">framework context and guidance</text><path d="M797 307V331" fill="none" stroke="#70876e" stroke-width="2" marker-end="url(#arrow)"/><rect x="663" y="334" width="269" height="85" rx="9" fill="#f4f7ef" stroke="#c4d2bb"/><text x="674" y="366" font-family="Arial,sans-serif" font-size="14" fill="#203e31" font-weight="normal">Read → edit or decide → verify</text><text x="674" y="390" font-family="Arial,sans-serif" font-size="14" fill="#203e31" font-weight="normal">Repair within a fixed budget</text><text x="666" y="468" font-family="Arial,sans-serif" font-size="13" fill="#62735b" font-weight="normal">Independent task grading</text><path d="M797 495V531" fill="none" stroke="#70876e" stroke-width="2" marker-end="url(#arrow)"/><rect x="965" y="20" width="295" height="475" rx="9" fill="#fbfcf8" stroke="#c4d2bb"/><text x="981" y="50" font-family="Arial,sans-serif" font-size="13" fill="#62735b" font-weight="normal">04 / REVIEW</text><text x="981" y="82" font-family="Arial,sans-serif" font-size="19" fill="#203e31" font-weight="bold">JEV</text><rect x="978" y="110" width="269" height="85" rx="9" fill="#f4f7ef" stroke="#c4d2bb"/><text x="989" y="142" font-family="Arial,sans-serif" font-size="14" fill="#203e31" font-weight="normal">Authored synthetic cases</text><text x="989" y="166" font-family="Arial,sans-serif" font-size="14" fill="#203e31" font-weight="normal">Independent expected findings</text><path d="M1112 195V219" fill="none" stroke="#70876e" stroke-width="2" marker-end="url(#arrow)"/><rect x="978" y="222" width="269" height="85" rx="9" fill="#f4f7ef" stroke="#c4d2bb"/><text x="989" y="254" font-family="Arial,sans-serif" font-size="14" fill="#203e31" font-weight="normal">Requirements + code + evidence</text><text x="989" y="278" font-family="Arial,sans-serif" font-size="14" fill="#203e31" font-weight="normal">Review the stated scenarios</text><path d="M1112 307V331" fill="none" stroke="#70876e" stroke-width="2" marker-end="url(#arrow)"/><rect x="978" y="334" width="269" height="85" rx="9" fill="#f4f7ef" stroke="#c4d2bb"/><text x="989" y="366" font-family="Arial,sans-serif" font-size="14" fill="#203e31" font-weight="normal">Findings vs independent labels</text><text x="989" y="390" font-family="Arial,sans-serif" font-size="14" fill="#203e31" font-weight="normal">Missed issues and false alarms</text><text x="981" y="468" font-family="Arial,sans-serif" font-size="13" fill="#62735b" font-weight="normal">Accuracy only when evaluated</text><path d="M1112 495V531" fill="none" stroke="#70876e" stroke-width="2" marker-end="url(#arrow)"/><path d="M167 532H1112M640 532V555" fill="none" stroke="#70876e" stroke-width="2" marker-end="url(#arrow)"/><rect x="160" y="560" width="960" height="66" rx="9" fill="#f4f7ef" stroke="#c4d2bb"/><text x="188" y="587" font-family="Arial,sans-serif" font-size="13" fill="#62735b" font-weight="normal">PRIVATE EVIDENCE</text><text x="188" y="611" font-family="Arial,sans-serif" font-size="18" fill="#203e31" font-weight="normal">Source snapshots, model requests, tool traces, test reports, fault checks and review records</text><path d="M640 626V648" fill="none" stroke="#70876e" stroke-width="2" marker-end="url(#arrow)"/><rect x="160" y="650" width="960" height="66" rx="9" fill="#f4f7ef" stroke="#c4d2bb"/><text x="188" y="677" font-family="Arial,sans-serif" font-size="13" fill="#62735b" font-weight="normal">VALIDATED PUBLIC SUMMARY</text><text x="188" y="701" font-family="Arial,sans-serif" font-size="17" fill="#203e31" font-weight="normal">Outcomes + denominators + timing + known costs + hashes → GitHub result feeds → dashboard</text><text x="40" y="762" font-family="Arial,sans-serif" font-size="16" fill="#62735b" font-weight="normal">Separate questions and protocols. Human effort and operating cost remain unmeasured. Synthetic evidence is not production impact.</text></svg>
