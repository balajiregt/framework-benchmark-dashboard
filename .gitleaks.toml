title = "Workspace secret scanning"
[extend]
useDefault = true

# Verified source revision identifiers, not authentication material.
[[allowlists]]
description = "Exact reviewed API source commit hashes in dashboard metadata"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "secret"
paths = ['''(?:impact/tasks|workflows/tasks|public/data/impact)\.json$''']
regexes = ['''^05307710c9568182507faedbceec5f2ce1c22c9f$''']

[[rules]]
id = "caseforge-api-key"
description = "CaseForge upload API key"
regex = '''qaf_[a-f0-9]{64}'''
keywords = ["qaf_"]
