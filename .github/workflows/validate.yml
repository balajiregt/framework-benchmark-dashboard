name: Validate public benchmark dashboard
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '26.13.0'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.15.2'
      - name: Install hashed test dependency
        run: |
          python3 -m pip install --require-hashes --only-binary=:all: -r scripts/requirements-python-build.lock
          python3 -m pip install --require-hashes --no-build-isolation --no-deps -r requirements.txt
      - run: npm test
      - run: npm run build
